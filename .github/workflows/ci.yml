name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run pytest with coverage gate
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80

      - name: Run offline eval smoke benchmark
        run: uv run python -c "from src.eval.runner import run_benchmarks; run_benchmarks(fixture_path='tests/fixtures/eval_cases.json', output_dir='artifacts/eval-ci')"

      - name: Upload html coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/
