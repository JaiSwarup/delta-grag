[project]
name = "btp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "pandas>=2.2.3",
    "pydantic>=2.9.0",
    "PyGithub>=2.5.0",
    "PyYAML>=6.0.2",
    "pytest>=9.0.2",
    "rich>=13.9.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.3",
    "seaborn>=0.13.2",
    "jinja2>=3.1.4",
    "tree-sitter>=0.25.2",
    "typer>=0.12.5",
    "uvicorn>=0.32.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
